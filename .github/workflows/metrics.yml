# GitHub Metrics - Auto-generate stats image
# Runs daily and on push to generate GitHub profile stats
# See: https://github.com/lowlighter/metrics

name: Generate GitHub Metrics

on:
  # Run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Run on push to main
  push:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Username
          user: Athoillah21
          
          # Output filename
          filename: assets/images/github-metrics.svg
          
          # Template and config
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Jakarta
          
          # Enable plugins
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 0%
          
          # Commit the generated file
          committer_branch: main
          committer_message: "📊 Update GitHub metrics"
