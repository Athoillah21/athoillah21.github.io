<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athoillah's Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/loader.css">
  <style>
    .hero-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Apple-style Glass Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
    }

    @media (max-width: 640px) {
      .glass-card {
        padding: 2rem 1.5rem;
        border-radius: 20px;
      }
    }

    .fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    .fade-in-delay-1 {
      animation-delay: 0.15s;
      opacity: 0;
    }

    .fade-in-delay-2 {
      animation-delay: 0.3s;
      opacity: 0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Apple-style Glass Explore Button */
    .scroll-indicator {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 0.75rem 1.5rem 0.75rem 0.875rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .scroll-indicator:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(168, 85, 247, 0.3);
      transform: translateY(-2px);
      box-shadow:
        0 8px 32px rgba(168, 85, 247, 0.15),
        0 4px 24px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .scroll-indicator .icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.1));
      border: 1px solid rgba(168, 85, 247, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .scroll-indicator:hover .icon-wrap {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.35), rgba(236, 72, 153, 0.2));
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }

    .scroll-indicator .arrow {
      color: #a855f7;
      font-size: 1.25rem;
      animation: bounce-arrow 2s ease-in-out infinite;
    }

    .scroll-indicator .explore-text {
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
    }

    .scroll-indicator .explore-label {
      font-size: 0.625rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
    }

    .scroll-indicator .explore-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: -0.01em;
    }

    .scroll-indicator:hover .explore-title {
      color: #fff;
    }

    .scroll-indicator:hover .explore-label {
      color: rgba(168, 85, 247, 0.7);
    }

    @keyframes bounce-arrow {

      0%,
      100% {
        transform: translateY(-2px);
        opacity: 0.8;
      }

      50% {
        transform: translateY(3px);
        opacity: 1;
      }
    }

    /* Mobile menu */
    .mobile-menu {
      display: none;
    }

    .mobile-menu.active {
      display: flex;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="bg-black text-white">
  <!-- Galaxy Loading Screen -->
  <div id="galaxy-loader">
    <div class="galaxy-core"></div>
    <div class="galaxy-ring"></div>
    <div class="galaxy-ring"></div>
    <div class="galaxy-ring"></div>
    <div class="galaxy-ring"></div>
    <div class="galaxy-ring"></div>
  </div>

  <div class="spline-container">
    <iframe src='https://my.spline.design/claritystream-a72K0KUwFoZV82QBzvu52Kai/' frameborder='0' width='100%'
      height='100%'></iframe>
  </div>

  <div class="content-container min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="container mx-auto px-4 sm:px-6 py-4 sm:py-6 sticky top-0 bg-black/90 backdrop-blur-md z-20">
      <div class="flex items-center justify-between w-full">
        <a href="index.html" class="flex items-center gap-3 group">
          <div class="relative">
            <!-- Rotating Ring -->
            <div
              class="absolute -inset-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300"
              style="background: conic-gradient(from 0deg, transparent, rgba(168, 85, 247, 0.6), rgba(236, 72, 153, 0.4), transparent 60%); animation: spin 3s linear infinite;">
            </div>
            <!-- Logo Icon -->
            <div class="relative z-10 transition-transform duration-300 group-hover:scale-110">
              <svg
                class="h-6 w-6 sm:h-7 sm:w-7 text-purple-500 drop-shadow-[0_0_8px_rgba(168,85,247,0.5)] group-hover:drop-shadow-[0_0_15px_rgba(168,85,247,0.8)]"
                viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z">
                </path>
              </svg>
            </div>
          </div>
          <!-- Name with gradient hover -->
          <span
            class="text-base sm:text-lg tracking-tight text-white group-hover:bg-gradient-to-r group-hover:from-purple-400 group-hover:via-pink-400 group-hover:to-red-400 group-hover:bg-clip-text group-hover:text-transparent transition-all duration-300">Athoillah</span>
        </a>

        <!-- Desktop Nav -->
        <div class="hidden md:flex items-center space-x-8 lg:space-x-10 text-sm text-gray-400">
          <a href="pages/about.html" class="hover:text-white transition-colors">About</a>
          <a href="pages/projects.html" class="hover:text-white transition-colors">Projects</a>
          <a href="pages/notes.html" class="hover:text-white transition-colors">Notes</a>
          <a href="pages/clients.html" class="hover:text-white transition-colors">Clients</a>
          <a href="pages/contact.html"
            class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-full transition-colors">Contact</a>
        </div>

        <!-- Mobile Menu Button -->
        <button id="menu-btn" class="md:hidden text-gray-400 hover:text-white p-2">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </div>

      <!-- Mobile Menu -->
      <div id="mobile-menu" class="mobile-menu flex-col gap-2 pt-4 md:hidden">
        <a href="pages/about.html" class="text-gray-400 hover:text-white py-2 px-2 rounded transition-colors">About</a>
        <a href="pages/projects.html"
          class="text-gray-400 hover:text-white py-2 px-2 rounded transition-colors">Projects</a>
        <a href="pages/notes.html" class="text-gray-400 hover:text-white py-2 px-2 rounded transition-colors">Notes</a>
        <a href="pages/clients.html"
          class="text-gray-400 hover:text-white py-2 px-2 rounded transition-colors">Clients</a>
        <a href="pages/contact.html"
          class="text-gray-400 hover:text-white py-2 px-2 rounded transition-colors">Contact</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <div class="flex-1 flex items-center justify-center relative px-4">
      <div class="hero-glow"></div>

      <div class="container mx-auto text-center relative z-10 max-w-3xl">
        <div class="glass-card">
          <!-- Name -->
          <h1
            class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-semibold tracking-tight mb-5 sm:mb-6 fade-in leading-tight">
            <span
              class="bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-pink-400 to-red-400">Muhammad
              Athoillah</span>
          </h1>

          <!-- Role -->
          <p class="text-gray-300 text-base sm:text-lg md:text-xl mb-3 fade-in fade-in-delay-1 leading-relaxed">
            <span
              class="font-medium bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">Database
              Administrator</span> at Telkomsigma
          </p>
        </div>
      </div>
    </div>

    <!-- Explore Section -->
    <div class="pb-10 sm:pb-14 flex justify-center">
      <a href="pages/about.html" class="scroll-indicator">
        <div class="icon-wrap">
          <span class="material-symbols-outlined arrow">expand_more</span>
        </div>
        <span class="explore-title">Explore More</span>
      </a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    // Mobile menu toggle
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if (menuBtn && mobileMenu) {
      menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('active');
        const icon = menuBtn.querySelector('span');
        icon.textContent = mobileMenu.classList.contains('active') ? 'close' : 'menu';
      });
    }
  </script>
  <script src="assets/js/loader.js"></script>
</body>

</html>
