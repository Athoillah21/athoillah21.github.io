<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athoillah's Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/loader.css">
  <style>
    .hero-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    .fade-in-delay-1 {
      animation-delay: 0.15s;
      opacity: 0;
    }

    .fade-in-delay-2 {
      animation-delay: 0.3s;
      opacity: 0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .scroll-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: rgba(139, 92, 246, 0.5);
      transition: all 0.3s ease;
    }

    .scroll-indicator:hover {
      color: rgba(139, 92, 246, 0.9);
    }

    .scroll-indicator .line {
      width: 1px;
      height: 30px;
      background: linear-gradient(to bottom, rgba(139, 92, 246, 0.5), transparent);
    }

    .scroll-indicator .arrow {
      animation: bounce-arrow 2s ease-in-out infinite;
    }

    @keyframes bounce-arrow {

      0%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      50% {
        transform: translateY(4px);
        opacity: 1;
      }
    }

    /* Mobile menu */
    .mobile-menu {
      display: none;
    }

    .mobile-menu.active {
      display: flex;
    }
  </style>
</head>

<body class="bg-black text-white">
  <!-- Galaxy Loading Screen -->
  <div id="galaxy-loader">
    <div class="galaxy-core"></div>
    <div class="galaxy-ring"></div>
    <div class="galaxy-ring"></div>
    <div class="galaxy-ring"></div>
    <div class="galaxy-ring"></div>
    <div class="galaxy-ring"></div>
  </div>

  <div class="spline-container">
    <iframe src='https://my.spline.design/claritystream-a72K0KUwFoZV82QBzvu52Kai/' frameborder='0' width='100%'
      height='100%'></iframe>
  </div>

  <div class="content-container min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="container mx-auto px-4 sm:px-6 py-4 sm:py-6 sticky top-0 bg-black/90 backdrop-blur-md z-20">
      <div class="flex items-center justify-between w-full">
        <div class="flex items-center">
          <svg class="h-6 w-6 sm:h-7 sm:w-7 text-purple-500" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z">
            </path>
          </svg>
          <a href="index.html"
            class="ml-2 sm:ml-3 text-base sm:text-lg tracking-tight cursor-pointer hover:text-white transition-colors">Athoillah</a>
        </div>

        <!-- Desktop Nav -->
        <div class="hidden md:flex items-center space-x-8 lg:space-x-10 text-sm text-gray-400">
          <a href="pages/about.html" class="hover:text-white transition-colors">About</a>
          <a href="pages/projects.html" class="hover:text-white transition-colors">Projects</a>
          <a href="pages/clients.html" class="hover:text-white transition-colors">Clients</a>
          <a href="pages/contact.html"
            class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-full transition-colors">Contact</a>
        </div>

        <!-- Mobile Menu Button -->
        <button id="menu-btn" class="md:hidden text-gray-400 hover:text-white p-2">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </div>

      <!-- Mobile Menu -->
      <div id="mobile-menu" class="mobile-menu flex-col gap-2 pt-4 md:hidden">
        <a href="pages/about.html" class="text-gray-400 hover:text-white py-2 px-2 rounded transition-colors">About</a>
        <a href="pages/projects.html"
          class="text-gray-400 hover:text-white py-2 px-2 rounded transition-colors">Projects</a>
        <a href="pages/clients.html"
          class="text-gray-400 hover:text-white py-2 px-2 rounded transition-colors">Clients</a>
        <a href="pages/contact.html"
          class="text-gray-400 hover:text-white py-2 px-2 rounded transition-colors">Contact</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <div class="flex-1 flex items-center justify-center relative px-4">
      <div class="hero-glow"></div>

      <div class="container mx-auto text-center relative z-10 max-w-3xl">
        <!-- Name -->
        <h1
          class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-semibold tracking-tight mb-5 sm:mb-6 fade-in leading-tight">
          <span class="bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-pink-400 to-red-400">Muhammad
            Athoillah</span>
        </h1>

        <!-- Role -->
        <p class="text-gray-300 text-base sm:text-lg md:text-xl mb-3 fade-in fade-in-delay-1 leading-relaxed">
          <span class="text-white font-medium">Database Administrator</span> at Telkomsigma
        </p>
        <p class="text-gray-500 text-sm sm:text-base fade-in fade-in-delay-2 leading-relaxed px-4">
          Specializing in PostgreSQL, High Availability & Performance Optimization
        </p>
      </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="pb-8 sm:pb-10 flex justify-center">
      <a href="pages/about.html" class="scroll-indicator">
        <span class="line"></span>
        <span class="text-[10px] sm:text-xs tracking-[0.2em] uppercase font-light">Explore</span>
        <span class="material-symbols-outlined arrow text-base">expand_more</span>
      </a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    // Mobile menu toggle
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if (menuBtn && mobileMenu) {
      menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('active');
        const icon = menuBtn.querySelector('span');
        icon.textContent = mobileMenu.classList.contains('active') ? 'close' : 'menu';
      });
    }
  </script>
  <script src="assets/js/loader.js"></script>
</body>

</html>
