    <style>
        /* Notes-specific animations */
        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutLeft {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(-100%);
                opacity: 0;
            }
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-slide-in {
            animation: slideInLeft 0.4s ease-out forwards;
        }

        .animate-slide-out {
            animation: slideOutLeft 0.3s ease-in forwards;
        }

        .animate-fade-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .animate-scale-in {
            animation: scaleIn 0.3s ease-out forwards;
        }

        /* Markdown preview styles */
        .markdown-preview h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #e879f9;
        }

        .markdown-preview h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 1.25rem 0 0.75rem;
            color: #c084fc;
        }

        .markdown-preview h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 1rem 0 0.5rem;
            color: #a855f7;
        }

        .markdown-preview p {
            margin-bottom: 0.75rem;
            line-height: 1.7;
            color: #d1d5db;
        }

        .markdown-preview code {
            background: rgba(139, 92, 246, 0.2);
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            font-family: monospace;
            color: #e879f9;
        }

        .markdown-preview pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .markdown-preview pre code {
            background: transparent;
            padding: 0;
            color: #d1d5db;
        }

        .markdown-preview ul,
        .markdown-preview ol {
            margin: 0.75rem 0;
            padding-left: 1.5rem;
            color: #d1d5db;
        }

        .markdown-preview li {
            margin-bottom: 0.35rem;
        }

        .markdown-preview blockquote {
            border-left: 3px solid #a855f7;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #9ca3af;
            font-style: italic;
        }

        .markdown-preview a {
            color: #c084fc;
            text-decoration: underline;
        }

        .markdown-preview table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        .markdown-preview th,
        .markdown-preview td {
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 0.5rem;
            text-align: left;
        }

        .markdown-preview th {
            background: rgba(139, 92, 246, 0.2);
            color: #e879f9;
        }
    </style>

    <script>
        // Sidebar state
        let notesSidebarVisible = true;

        // Toggle sidebar visibility with smooth animation
        function toggleNotesSidebar() {
            const panel = document.getElementById('notes-sidebar');
            const showBtn = document.getElementById('show-notes-sidebar-btn');

            if (notesSidebarVisible) {
                // Hide panel - slide out to left
                panel.style.transform = 'translateX(-100%)';
                panel.style.opacity = '0';

                // After animation, collapse the panel width
                setTimeout(() => {
                    panel.style.width = '0';
                    panel.style.marginRight = '-1.5rem';
                }, 300);

                // Show button - slide in from left
                setTimeout(() => {
                    showBtn.style.transform = 'translateX(0)';
                    showBtn.style.opacity = '1';
                    showBtn.style.pointerEvents = 'auto';
                }, 200);

                notesSidebarVisible = false;
            } else {
                // Restore panel width first
                panel.style.width = '20rem';
                panel.style.marginRight = '0';

                // Hide button - slide out to left
                showBtn.style.transform = 'translateX(-100%)';
                showBtn.style.opacity = '0';
                showBtn.style.pointerEvents = 'none';

                // Show panel - slide in from left
                setTimeout(() => {
                    panel.style.transform = 'translateX(0)';
                    panel.style.opacity = '1';
                }, 150);

                notesSidebarVisible = true;
            }
        }
    </script>
