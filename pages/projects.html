                                viewBox="0 0 24 24" fill="currentColor">

                </div>

                <a href="clients.html" class="text-gray-400 hover:text-white py-2 px-2">Clients</a>
                <a href="contact.html" class="text-gray-400 hover:text-white py-2 px-2">Contact</a>

        <!-- Projects Content -->
        <div class="container mx-auto px-4 sm:px-6 py-8 sm:py-12">
            <h1
                class="text-2xl sm:text-3xl md:text-4xl font-semibold tracking-tight mb-8 sm:mb-10 leading-tight bg-clip-text text-transparent bg-gradient-to-r from-red-400 to-purple-400 text-center">
                My Projects
            </h1>

            <!-- Admin Panel (hidden by default) -->
            <div id="admin-panel" class="hidden mb-8 flex flex-wrap gap-4 justify-center">
                <button onclick="ProjectsManager.openModal()"
                    class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-3 rounded-lg flex items-center gap-2 transition-colors">
                    <span class="material-symbols-outlined">add</span>
                    Add Project
                </button>
                <button onclick="ProjectsManager.exportJSON()"
                    class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-lg flex items-center gap-2 transition-colors">
                    <span class="material-symbols-outlined">download</span>
                    Export JSON
                </button>
            </div>

            <!-- Main Content with Sidebar -->
            <div class="flex gap-6 max-w-7xl mx-auto relative">

                <!-- Left Sidebar - Project List -->
                <div id="project-list-panel"
                    class="hidden lg:block w-72 flex-shrink-0 transition-all duration-500 ease-out"
                    style="transform: translateX(0); opacity: 1;">
                    <div class="sticky top-24">
                        <div class="rounded-xl bg-black/40 backdrop-blur-md border border-white/10 overflow-hidden">
                            <!-- Header -->
                            <div
                                class="w-full flex items-center justify-between px-4 py-3 bg-white/5 border-b border-white/10">
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-purple-400 text-lg">list</span>
                                    <span class="text-white font-medium text-sm">Projects</span>
                                </div>
                                <span id="project-count"
                                    class="text-xs bg-purple-600/50 text-purple-200 px-2 py-0.5 rounded-full">0</span>
                            </div>
                            <!-- List Items -->
                            <div id="project-quick-list" class="max-h-[60vh] overflow-y-auto">
                                <div class="p-3 space-y-1" id="project-list-items">
                                    <!-- Project list items will be populated by JavaScript -->
                                </div>
                            </div>
                        </div>
                        <!-- Hide Button -->
                        <button onclick="toggleSidebar()"
                            class="mt-3 w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-gray-400 hover:text-white transition-all text-sm">
                            <span class="material-symbols-outlined text-sm">chevron_left</span>
                            Hide Panel
                        </button>
                    </div>
                </div>

                <!-- Show Sidebar Button (when hidden) -->
                <button id="show-sidebar-btn" onclick="toggleSidebar()"
                    class="fixed left-0 top-1/2 -translate-y-1/2 z-30 bg-purple-600 hover:bg-purple-500 text-white p-3 rounded-r-xl shadow-lg backdrop-blur-md border border-white/10 transition-all duration-300 opacity-0 -translate-x-full"
                    style="pointer-events: none;">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>

                <!-- Projects Container (dynamically populated) -->
                <div class="flex-1">
                    <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Projects will be loaded here by JavaScript -->
                        <div class="col-span-2 text-center text-gray-400">
                            <span class="material-symbols-outlined animate-spin text-4xl">refresh</span>
                            <p class="mt-2">Loading projects...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add/Edit Project Modal -->
        <div id="project-modal"
            class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                <div class="p-6 border-b border-gray-800 flex items-center justify-between">
                    <h2 class="text-xl font-semibold text-white">Add New Project</h2>
                    <button onclick="ProjectsManager.closeModal()" class="text-gray-400 hover:text-white">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <form id="project-form" class="p-6 space-y-6">
                    <input type="hidden" id="project-id" name="id">

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Title *</label>
                        <input type="text" name="title" required
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-colors"
                            placeholder="Project name">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Description *</label>
                        <textarea name="description" required rows="3"
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-colors resize-none"
                            placeholder="Brief description of the project"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Image URL</label>
                            <input type="url" name="image"
                                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-colors"
                                placeholder="https://...">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Fallback Text</label>
                            <input type="text" name="imageText"
                                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-colors"
                                placeholder="Text if no image">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">GitHub URL</label>
                        <input type="url" name="githubUrl"
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-colors"
                            placeholder="https://github.com/...">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Medium/Article URL</label>
                        <input type="url" name="mediumUrl"
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-colors"
                            placeholder="https://medium.com/...">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Tags (comma-separated) *</label>
                        <input type="text" name="tags" required
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-colors"
                            placeholder="Python, Flask, PostgreSQL">
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 pt-4">
                        <button type="button" onclick="ProjectsManager.saveProject(true)"
                            class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-black font-medium px-6 py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-xl">draft</span>
                            Save as Draft
                        </button>
                        <button type="button" onclick="ProjectsManager.saveProject(false)"
                            class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-medium px-6 py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-xl">save</span>
                            Publish
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer -->

                    <a href="https://github.com/Athoillah21" target="_blank"

                        class="hover:text-white transition-colors">Twitter</a>
                </div>
            </div>
        </footer>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/projects-manager.js"></script>
    <script src="../assets/js/loader.js"></script>
    <script>
        // Sidebar state
        let sidebarVisible = true;

        // Toggle sidebar visibility with smooth animation
        function toggleSidebar() {
            const panel = document.getElementById('project-list-panel');
            const showBtn = document.getElementById('show-sidebar-btn');

            if (sidebarVisible) {
                // Hide panel - slide out to left
                panel.style.transform = 'translateX(-100%)';
                panel.style.opacity = '0';

                // Show button - slide in from left
                setTimeout(() => {
                    showBtn.style.transform = 'translateX(0)';
                    showBtn.style.opacity = '1';
                    showBtn.style.pointerEvents = 'auto';
                }, 200);

                sidebarVisible = false;
            } else {
                // Hide button - slide out to left
                showBtn.style.transform = 'translateX(-100%)';
                showBtn.style.opacity = '0';
                showBtn.style.pointerEvents = 'none';

                // Show panel - slide in from left
                setTimeout(() => {
                    panel.style.transform = 'translateX(0)';
                    panel.style.opacity = '1';
                }, 150);

                sidebarVisible = true;
            }
        }

        // Toggle project list (kept for compatibility)
        function toggleProjectList() { }

        // Populate project list after projects load
        const originalRenderProjects = ProjectsManager.renderProjects.bind(ProjectsManager);
        ProjectsManager.renderProjects = function () {
            originalRenderProjects();
            populateProjectList();
        };

        function populateProjectList() {
            const listContainer = document.getElementById('project-list-items');
            const countEl = document.getElementById('project-count');
            const projects = ProjectsManager.projects;

            if (!listContainer || !projects.length) return;

            countEl.textContent = projects.length;

            listContainer.innerHTML = projects.map((project, index) => `
                <a href="#project-${index}" 
                   onclick="scrollToProject(${index}); return false;"
                   class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-purple-600/30 border border-transparent hover:border-purple-500/30 transition-all duration-200 group cursor-pointer">
                    <span class="text-purple-400 font-mono text-xs">${String(index + 1).padStart(2, '0')}</span>
                    <span class="text-gray-300 group-hover:text-white transition-colors flex-1 truncate text-sm">${project.title}</span>
                </a>
            `).join('');
        }

        function scrollToProject(index) {
            const cards = document.querySelectorAll('#projects-container > div');
            if (cards[index]) {
                cards[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                cards[index].classList.add('ring-2', 'ring-purple-500');
                setTimeout(() => {
                    cards[index].classList.remove('ring-2', 'ring-purple-500');
                }, 2000);
            }
        }
    </script>
